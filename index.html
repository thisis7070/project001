<!DOCTYPE html>
<html>

<head>
    <title>Skill Gap Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>Skill Gap Analyzer</h1>

        <h2>Welcome Back 👋</h2>

        <form>

            <!-- Role Selection -->
            <label class="box">Role</label>

            <select id="role">

                <option value="">
                    Select Role
                </option>

                <option value="student">
                    Student
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>


            <!-- User ID / Name -->
            <label class="box">Name / ID</label>

            <input
                type="text"
                id="userId"
                placeholder="Enter your name or ID"
            >


            <!-- Password -->
            <label class="box">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <!-- Login Button -->
            <button type="submit">
                Login
            </button>

        </form>

    </div>


    <script src="script.js"></script>

</body>

</html>
