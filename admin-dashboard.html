
<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Skill Gap Analyzer</h1>

        <!-- Dynamic Welcome Message -->
        <h2 id="adminWelcome">
            Welcome Admin 👋
        </h2>

        <p>
            Manage job roles, skills and learning resources.
        </p>


        <div class="dashboard-buttons">

            <!-- Manage Job Roles -->
            <button onclick="manageRoles()">
                Manage Job Roles
            </button>


            <!-- Manage Skills -->
            <button onclick="manageSkills()">
                Manage Skills
            </button>


            <!-- Manage Resources -->
            <button onclick="manageResources()">
                Manage Learning Resources
            </button>


            <!-- Logout -->
            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
