<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Skill Gap Analyzer</h1>

        <h2 id="adminWelcome">Welcome Admin 👋</h2>

        <p>
            Manage job roles, required skills and learning resources.
        </p>

        <div class="dashboard-buttons">

            <button onclick="manageRoles()">
                Manage Job Roles
            </button>

            <button onclick="manageSkills()">
                Manage Skills
            </button>

            <button onclick="manageResources()">
                Manage Learning Resources
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
